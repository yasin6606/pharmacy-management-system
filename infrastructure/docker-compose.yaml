services:
  postgres:
    image: postgres:13-alpine
    container_name: pharmacy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: pharmacy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d pharmacy_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharmacy-net

  backend:
    build:
      context: ./../backend
      dockerfile: Dockerfile
    container_name: pharmacy-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:123456@postgres:5432/pharmacy_db
      JWT_SECRET: your-very-secure-secret-key
      JWT_EXPIRES_IN: 7d
      TITAK_API_KEY: your-titak-key
      # No CORS needed (same origin via Nginx), but you can keep it if you like
      CORS_ORIGIN: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pharmacy-net

  frontend:
    build:
      context: ./../frontend
      dockerfile: Dockerfile
      args:
        # Relative URL – the public URL when accessed through Nginx
        NEXT_PUBLIC_API_URL: "/api/v1"
    container_name: pharmacy-frontend
    restart: unless-stopped
    # No port exposed to host – only Nginx talks to it
    networks:
      - pharmacy-net

  nginx:
    image: nginx:1.27.1-alpine
    container_name: pharmacy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - pharmacy-net

volumes:
  postgres_data:

networks:
  pharmacy-net:
