# Reverse proxy — single public entrypoint for the pharmacy stack.
# Frontend (Next.js) and Backend (Express) are not published on the host.

upstream pharmacy_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream pharmacy_backend {
    server backend:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Security headers (basic)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API → Express ----
    # Backend routes are mounted at /api/v1; keep the full path when proxying.
    location /api/ {
        proxy_pass http://pharmacy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Liveness for ops (does not go through Next auth)
    location = /health {
        proxy_pass http://pharmacy_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- App → Next.js ----
    location / {
        proxy_pass http://pharmacy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
